<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>FilmWise | Signup</title>

	<link href="{% static 'website/css/bootstrap.min.css' %}" rel="stylesheet" >
	<link href="{% static 'website/css/font-awesome.min.css' %}" rel="stylesheet" >
	<link href="{% static 'website/css/global.css' %}" rel="stylesheet">
	<link href="{% static 'website/css/index.css' %}" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Rajdhani&display=swap" rel="stylesheet">
	<script src="{% static 'website/js/bootstrap.bundle.min.js' %}"></script>
</head>

<body>

<div class="auth-wrapper d-flex justify-content-center align-items-center" style="min-height:100vh;">
    <div class="blog_1r1 p-4 mt-4" style="width: 450px; background:#111; border-radius:10px;">

        <h4 class="text-white">Signup <span class="col_red">Form</span></h4>
        <hr class="line mb-4">

        <form method="POST" action="{% url 'save_registration' %}" 
              name="signupForm" onsubmit="return signup_validation()" novalidate>
            {% csrf_token %}

            <!-- Username -->
            <div class="input-group input-group-merge mb-3">
                <div class="input-group-text bg-transparent text-white border-right-0">
                    <i class="fa fa-user"></i>
                </div>
                <input type="text" name="username" class="form-control bg-transparent text-white"
                       placeholder="Username" required>
            </div>
            <p id="err_username" class="text-danger small"></p>

            <!-- Email -->
            <div class="input-group input-group-merge mb-3">
                <div class="input-group-text bg-transparent text-white border-right-0">
                    <i class="fa fa-envelope"></i>
                </div>
                <input type="email" name="email" class="form-control bg-transparent text-white"
                       placeholder="Email" required>
            </div>
            <p id="err_email" class="text-danger small"></p>

            <!-- Password -->
            <div class="input-group input-group-merge mb-3">
                <div class="input-group-text bg-transparent text-white border-right-0">
                    <i class="fa fa-lock"></i>
                </div>
                <input type="password" id="password" name="password"
                       class="form-control bg-transparent text-white"
                       placeholder="Password" required>
                <span class="input-group-text bg-transparent border-left-0 text-white" style="cursor:pointer;"
                      onclick="togglePassword('password','toggleIcon')">
                    <i id="toggleIcon" class="fa fa-eye"></i>
                </span>
            </div>
            <p id="err_password" class="text-danger small"></p>

            <!-- Confirm Password -->
            <div class="input-group input-group-merge mb-3">
                <div class="input-group-text bg-transparent text-white border-right-0">
                    <i class="fa fa-lock"></i>
                </div>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       class="form-control bg-transparent text-white"
                       placeholder="Confirm Password" required>
                <span class="input-group-text bg-transparent border-left-0 text-white" style="cursor:pointer;"
                      onclick="togglePassword('confirmPassword','toggleConfirm')">
                    <i id="toggleConfirm" class="fa fa-eye"></i>
                </span>
            </div>
            <p id="err_confirm" class="text-danger small"></p>

            <button type="submit" class="button w-100">
                <i class="fa fa-user-plus me-1"></i> Create Account
            </button>

        </form>

        <h6 class="mt-3 text-white">Already have an account?
            <a class="col_red" href="{% url 'login' %}">Login here</a>
        </h6>

    </div>
</div>
<script>
function signup_validation() {

    
    document.getElementById("err_username").innerHTML = "";
    document.getElementById("err_email").innerHTML = "";
    document.getElementById("err_password").innerHTML = "";
    document.getElementById("err_confirm").innerHTML = "";

    let username = document.signupForm.username.value;
    let email = document.signupForm.email.value;
    let password = document.signupForm.password.value;
    let confirmPassword = document.signupForm.confirmPassword.value;

    let valid = true;

    if (username === "" || username === null) {
        document.getElementById("err_username").innerHTML = "Username cannot be blank!";
        valid = false;
    }

    if (email === "" || email === null) {
        document.getElementById("err_email").innerHTML = "Email cannot be blank!";
        valid = false;
    }

    if (password === "" || password === null) {
        document.getElementById("err_password").innerHTML = "Password cannot be blank!";
        valid = false;
    }
    else if (password.length < 6) {
        document.getElementById("err_password").innerHTML = "Password must be at least 6 characters!";
        valid = false;
    }

    if (confirmPassword === "" || confirmPassword === null) {
        document.getElementById("err_confirm").innerHTML = "Confirm Password cannot be blank!";
        valid = false;
    }
    else if (password !== confirmPassword) {
        document.getElementById("err_confirm").innerHTML = "Passwords do not match!";
        valid = false;
    }

    return valid;
}
</script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
{% if messages %}
  {% for i in messages %}
    <script>
      Swal.fire({
        title: "FilmWise",
        text: "{{ i|escapejs }}",
        background: "#000",
        color: "#e50914",
        icon: "{{ i.tags }}",
        iconColor: "#e50914",
        confirmButtonColor: "#e50914",
        timer: 2500,
        showConfirmButton: false
      });
    </script>
  {% endfor %}
{% endif %}
</body>
</html>
