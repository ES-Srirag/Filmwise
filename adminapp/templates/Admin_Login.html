
<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="utf-8">
    <title>Login</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto:wght@500;700&display=swap" rel="stylesheet"> 
    
    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="{% static 'admin_dashboard/lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">
    <link href="{% static 'admin_dashboard/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css' %}" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="{% static 'admin_dashboard/css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="{% static 'admin_dashboard/css/style.css' %}" rel="stylesheet">
</head>

<body>
    <div class="container-fluid position-relative d-flex p-0">
        <!-- Spinner Start -->
        <div id="spinner" class="show bg-dark position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
        <!-- Spinner End -->


        <!-- Sign In Start -->
<div class="container-fluid">
    <div class="row h-100 align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
            <div class="bg-secondary rounded p-4 p-sm-5 my-4 mx-3">

                <!-- Centered Header -->
                <div class="d-flex justify-content-center mb-3">
                    <h3 class="text-primary"><i class="fa fa-user-edit me-2"></i>Admin Login</h3>
                </div>

                <!-- Login Form -->
                <form name="signinForm" method="POST" action="{% url 'admin_login' %}" onsubmit="return signin_validation()">
                    {% csrf_token %}

                    <!-- Username -->
                    <div class="form-floating mb-3">
                        <input type="text" name="username" class="form-control" id="floatingInput" placeholder="Username" required>
                        <label for="floatingInput">Username</label>
                    </div>

                    <!-- Password -->
                    <div class="form-floating mb-4">
                        <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                        <label for="floatingPassword">Password</label>
                    </div>

                    <!-- Show Password Checkbox -->
                    <div class="d-flex align-items-center justify-content-start mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="showPassword">
                            <label class="form-check-label" for="showPassword">Show password</label>
                        </div>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn btn-primary py-3 w-100 mb-4">Sign In</button>

                    

                </form>
                <!-- Login Form End -->

            </div>
        </div>
    </div>
</div>
<!-- Sign In End -->

    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'admin_dashboard/lib/chart/chart.min.js' %}"></script>
    <script src="{% static 'admin_dashboard/lib/easing/easing.min.js' %}"></script>
    <script src="{% static 'admin_dashboard/lib/waypoints/waypoints.min.js' %}"></script>
    <script src="{% static 'admin_dashboard/lib/owlcarousel/owl.carousel.min.js' %}"></script>
    <script src="{% static 'admin_dashboard/lib/tempusdominus/js/moment.min.js' %}"></script>
    <script src="{% static 'admin_dashboard/lib/tempusdominus/js/moment-timezone.min.js' %}"></script>
    <script src="{% static 'admin_dashboard/lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js' %}"></script>
    <script>
    // Show/Hide Password
    const showPassword = document.querySelector('#showPassword');
    const password = document.querySelector('#floatingPassword');

    showPassword.addEventListener('change', function () {
        if (this.checked) {
            password.type = 'text';
        } else {
            password.type = 'password';
        }
    });

    // Form Validation
    function signin_validation() {
        let username = document.signinForm.username.value.trim();
        let passwordVal = document.signinForm.password.value.trim();

        if (username === "" || username === null) {
            alert("Username cannot be blank!");
            return false;
        } 
        else if (passwordVal === "" || passwordVal === null) {
            alert("Password cannot be blank!");
            return false;
        } 
        else if (passwordVal.length < 6) {
            alert("Password must be at least 6 characters!");
            return false;
        }

        return true;
    }
</script>

    <!-- Template Javascript -->
    <script src="{% static 'admin_dashboard/js/main.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
{% if messages %}
  {% for i in messages %}
    <script>
      Swal.fire({
        title: "MovieAdmin",
        text: "{{ i|escapejs }}",
        background: "#000",
        color: "#e50914",
        icon: "{{ i.tags }}",
        iconColor: "#e50914",
        confirmButtonColor: "#e50914",
        timer: 2500,
        showConfirmButton: false
      });
    </script>
  {% endfor %}
{% endif %}
</body>

</html>
