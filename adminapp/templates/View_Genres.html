{% extends 'index.html' %}
{% load static %}
{% block content %}

<!-- Genres Start -->
<div class="container-fluid pt-4 px-4">
    <div class="row g-4">
        <div class="col-12">
            <div class="bg-secondary rounded h-100 p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h6 class="mb-0 text-white">All Genres</h6>
                    <a href="{% url 'add_genre' %}" class="btn btn-sm btn-primary">
                        Add New Genre
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle mb-0">
                        <thead class="table-dark text-center">
                            <tr>
                                <th>#</th>
                                <th>Genre Name</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>

                        {% for g in genres %}
                            <tr>
                                <td class="text-center">{{ forloop.counter }}</td>
                                <td>{{ g.genre_name }}</td>
                                <td>{{ g.description|default:"-" }}</td>
                                <td class="text-center">
                                    <a href="{% url 'edit_genre' g.id %}"
                                       class="btn btn-sm btn-warning me-1">
                                        Edit
                                    </a>
                                    <a href="{% url 'delete_genre' g.id %}"
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('Are you sure you want to delete this genre?')">
                                        Delete
                                    </a>
                                </td>
                            </tr>
                        {% empty %}
                            <tr>
                                <td colspan="4" class="text-center text-muted">
                                    No genres found.
                                </td>
                            </tr>
                        {% endfor %}

                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>
<!-- Genres End -->

{% endblock %}
